# PIPELINE DEFINITION
# Name: pod-placement-training-pipeline
# Description: Voting Regressor Training Pipeline (RF, XGBoost, CatBoost, GBR, ExtraTrees)
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        scenario_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        x_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        x_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        metrics_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-load-dataset:
    executorLabel: exec-load-dataset
    outputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess:
    executorLabel: exec-preprocess
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        scenario_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        x_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        x_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        x_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-upload-metrics:
    executorLabel: exec-upload-metrics
    inputDefinitions:
      artifacts:
        metrics_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-upload-model:
    executorLabel: exec-upload-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model: Input[Model],\n    x_train: Input[Dataset],\n\
          \    y_train: Input[Dataset],\n    x_test: Input[Dataset],\n    y_test:\
          \ Input[Dataset],\n    scenario_test: Input[Dataset],\n    metrics: Output[Metrics],\n\
          \    metrics_csv: Output[Dataset],\n):\n    import joblib\n    import pandas\
          \ as pd\n    from sklearn.metrics import mean_squared_error, mean_absolute_error\n\
          \n    def compute_top1_agreement(results_df):\n        true_best = (\n \
          \           results_df\n            .groupby(\"scenario_id\")[\"true_score\"\
          ]\n            .idxmin()\n        )\n        pred_best = (\n           \
          \ results_df\n            .groupby(\"scenario_id\")[\"predicted_score\"\
          ]\n            .idxmin()\n        )\n\n        true_best_rows = results_df.loc[true_best]\n\
          \        pred_best_rows = results_df.loc[pred_best]\n\n        matches =\
          \ 0\n        for scenario_id in true_best_rows[\"scenario_id\"]:\n     \
          \       true_index = true_best_rows[\n                true_best_rows[\"\
          scenario_id\"] == scenario_id\n            ].index[0]\n            pred_index\
          \ = pred_best_rows[\n                pred_best_rows[\"scenario_id\"] ==\
          \ scenario_id\n            ].index[0]\n            if true_index == pred_index:\n\
          \                matches += 1\n\n        return matches / len(true_best_rows)\n\
          \n    def compute_test_metrics(y_true, y_pred, scenario_ids):\n        rmse\
          \ = mean_squared_error(y_true, y_pred) ** 0.5\n        mae = mean_absolute_error(y_true,\
          \ y_pred)\n\n        results_df = pd.DataFrame({\n            \"scenario_id\"\
          : scenario_ids,\n            \"true_score\": y_true,\n            \"predicted_score\"\
          : y_pred,\n        })\n        top1 = compute_top1_agreement(results_df)\n\
          \n        return rmse, mae, top1\n\n    print(\"=\" * 60)\n    print(\"\
          Loading model bundle\")\n    print(\"=\" * 60)\n\n    trained_models = joblib.load(model.path)\n\
          \n    print(\"=\" * 60)\n    print(\"Loading train and test datasets\")\n\
          \    print(\"=\" * 60)\n\n    X_train = pd.read_csv(x_train.path)\n    y_train_true\
          \ = pd.read_csv(y_train.path)[\"score\"]\n\n    X_test = pd.read_csv(x_test.path)\n\
          \    y_test_df = pd.read_csv(y_test.path)\n    scenario_df = pd.read_csv(scenario_test.path)\n\
          \n    y_true = y_test_df[\"score\"]\n    scenario_ids = scenario_df[\"scenario_id\"\
          ]\n\n    print(f\"Training Samples : {len(X_train)}\")\n    print(f\"Testing\
          \ Samples  : {len(X_test)}\")\n\n    print(\"=\" * 60)\n    print(\"Generating\
          \ Predictions and Calculating Metrics Per Model\")\n    print(\"=\" * 60)\n\
          \n    rows = []\n\n    for name, mdl in trained_models.items():\n\n    \
          \    train_preds = mdl.predict(X_train)\n        test_preds = mdl.predict(X_test)\n\
          \n        train_rmse = mean_squared_error(y_train_true, train_preds) **\
          \ 0.5\n        train_mae = mean_absolute_error(y_train_true, train_preds)\n\
          \n        test_rmse, test_mae, top1 = compute_test_metrics(\n          \
          \  y_true, test_preds, scenario_ids\n        )\n\n        rmse_gap = test_rmse\
          \ - train_rmse\n        mae_gap = test_mae - train_mae\n\n        rows.append({\n\
          \            \"model\": name,\n            \"train_rmse\": train_rmse,\n\
          \            \"test_rmse\": test_rmse,\n            \"rmse_gap\": rmse_gap,\n\
          \            \"train_mae\": train_mae,\n            \"test_mae\": test_mae,\n\
          \            \"mae_gap\": mae_gap,\n            \"top1_agreement\": top1,\n\
          \        })\n\n        print(\n            f\"[{name}] \"\n            f\"\
          Train RMSE: {train_rmse:.4f} | Test RMSE: {test_rmse:.4f} | RMSE Gap: {rmse_gap:.4f}\
          \ | \"\n            f\"Train MAE: {train_mae:.4f} | Test MAE: {test_mae:.4f}\
          \ | MAE Gap: {mae_gap:.4f} | \"\n            f\"Top-1: {top1:.4f}\"\n  \
          \      )\n\n    metrics_df = pd.DataFrame(rows)\n\n    print(\"=\" * 60)\n\
          \    print(\"Saving Metrics CSV\")\n    print(\"=\" * 60)\n\n    metrics_df.to_csv(metrics_csv.path,\
          \ index=False)\n\n    print(f\"Metrics CSV saved at : {metrics_csv.path}\"\
          )\n\n    print(\"=\" * 60)\n    print(\"Logging Voting Regressor Metrics\"\
          )\n    print(\"=\" * 60)\n\n    voting_row = metrics_df[metrics_df[\"model\"\
          ] == \"voting_regressor\"].iloc[0]\n    metrics.log_metric(\"Test_RMSE\"\
          , float(voting_row[\"test_rmse\"]))\n    metrics.log_metric(\"Test_MAE\"\
          , float(voting_row[\"test_mae\"]))\n    metrics.log_metric(\"Top1_Agreement\"\
          , float(voting_row[\"top1_agreement\"]))\n    metrics.log_metric(\"RMSE_Gap\"\
          , float(voting_row[\"rmse_gap\"]))\n    metrics.log_metric(\"MAE_Gap\",\
          \ float(voting_row[\"mae_gap\"]))\n\n    print(\"=\" * 60)\n    print(\"\
          Evaluation Completed\")\n    print(\"=\" * 60)\n\n"
        image: pod-placement-trainer:v12
    exec-load-dataset:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_dataset
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_dataset(\n    dataset: Output[Dataset]\n):\n    from minio\
          \ import Minio\n    import os\n\n    print(\"=\" * 60)\n    print(\"Loading\
          \ dataset from MinIO\")\n    print(\"=\" * 60)\n\n    client = Minio(\n\
          \        \"host.minikube.internal:9000\",\n        access_key=\"minioadmin\"\
          ,\n        secret_key=\"minioadmin\",\n        secure=False,\n    )\n\n\
          \    os.makedirs(os.path.dirname(dataset.path), exist_ok=True)\n\n    client.fget_object(\n\
          \        bucket_name=\"datasets\",\n        object_name=\"dataset.csv\"\
          ,\n        file_path=dataset.path,\n    )\n\n    print(f\"Dataset saved\
          \ to: {dataset.path}\")\n\n"
        image: pod-placement-trainer:v12
    exec-preprocess:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess(\n    dataset: Input[Dataset],\n    x_train: Output[Dataset],\n\
          \    x_test: Output[Dataset],\n    y_train: Output[Dataset],\n    y_test:\
          \ Output[Dataset],\n    scenario_test: Output[Dataset],\n):\n    import\
          \ pandas as pd\n    from sklearn.model_selection import train_test_split\n\
          \n    print(\"=\" * 60)\n    print(\"Loading dataset\")\n    print(\"=\"\
          \ * 60)\n\n    df = pd.read_csv(dataset.path)\n\n    print(f\"Dataset Shape\
          \ : {df.shape}\")\n\n    print(\"=\" * 60)\n    print(\"Encoding categorical\
          \ features\")\n    print(\"=\" * 60)\n\n    difficulty_mapping = {\n   \
          \     \"easy\": 0,\n        \"medium\": 1,\n        \"hard\": 2,\n    }\n\
          \n    df[\"difficulty\"] = df[\"difficulty\"].map(difficulty_mapping)\n\n\
          \    features = [\n        \"difficulty\",\n        \"cu_cpu_free_ratio\"\
          ,\n        \"du_cpu_free_ratio\",\n        \"cu_mem_free_ratio\",\n    \
          \    \"du_mem_free_ratio\",\n        \"latency_ms\",\n        \"latency_budget\"\
          ,\n        \"same_node\",\n        \"same_zone\",\n        \"cu_load\",\n\
          \        \"du_load\",\n        \"cu_cpu_violation\",\n        \"cu_mem_violation\"\
          ,\n        \"du_cpu_violation\",\n        \"du_mem_violation\",\n      \
          \  \"cpu_balance\",\n        \"mem_balance\",\n        \"cu_cpu_req\",\n\
          \        \"du_cpu_req\",\n        \"cu_mem_req\",\n        \"du_mem_req\"\
          ,\n    ]\n\n    X = df[features]\n    y = df[\"score\"]\n    scenario_ids\
          \ = df[\"scenario_id\"]\n\n    (\n        X_train,\n        X_test,\n  \
          \      y_train_df,\n        y_test_df,\n        _,\n        scenario_test_df,\n\
          \    ) = train_test_split(\n        X,\n        y,\n        scenario_ids,\n\
          \        test_size=0.2,\n        random_state=42,\n    )\n\n    print(\"\
          =\" * 60)\n    print(\"Saving processed datasets\")\n    print(\"=\" * 60)\n\
          \n    X_train.to_csv(x_train.path, index=False)\n\n    X_test.to_csv(x_test.path,\
          \ index=False)\n\n    y_train_df.to_frame(\"score\").to_csv(\n        y_train.path,\n\
          \        index=False,\n    )\n\n    y_test_df.to_frame(\"score\").to_csv(\n\
          \        y_test.path,\n        index=False,\n    )\n\n    scenario_test_df.to_frame(\"\
          scenario_id\").to_csv(\n        scenario_test.path,\n        index=False,\n\
          \    )\n\n    print(\"Preprocessing Completed\")\n\n    print(f\"Training\
          \ Samples : {len(X_train)}\")\n    print(f\"Testing Samples  : {len(X_test)}\"\
          )\n\n"
        image: pod-placement-trainer:v12
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    x_train: Input[Dataset],\n    y_train: Input[Dataset],\n\
          \    model: Output[Model],\n):\n    import joblib\n    import pandas as\
          \ pd\n    from sklearn.ensemble import (\n        RandomForestRegressor,\n\
          \        ExtraTreesRegressor,\n        GradientBoostingRegressor,\n    \
          \    VotingRegressor,\n    )\n    from xgboost import XGBRegressor\n   \
          \ from catboost import CatBoostRegressor\n\n    print(\"=\" * 60)\n    print(\"\
          Loading training data\")\n    print(\"=\" * 60)\n\n    X_train = pd.read_csv(x_train.path)\n\
          \    y_train = pd.read_csv(y_train.path)[\"score\"]\n\n    print(f\"Training\
          \ Samples : {len(X_train)}\")\n    print(f\"Number of Features : {X_train.shape[1]}\"\
          )\n\n    print(\"=\" * 60)\n    print(\"Defining Base Estimators\")\n  \
          \  print(\"=\" * 60)\n\n    rf = RandomForestRegressor(\n        n_estimators=60,\n\
          \        max_depth=12,\n        random_state=42,\n        n_jobs=-1,\n \
          \   )\n\n    xgb = XGBRegressor(\n        n_estimators=150,\n        max_depth=6,\n\
          \        learning_rate=0.1,\n        random_state=42,\n        n_jobs=-1,\n\
          \    )\n\n    catboost = CatBoostRegressor(\n        iterations=300,\n \
          \       depth=6,\n        learning_rate=0.1,\n        random_state=42,\n\
          \        verbose=False,\n    )\n\n    gbr = GradientBoostingRegressor(\n\
          \        n_estimators=150,\n        max_depth=4,\n        learning_rate=0.1,\n\
          \        random_state=42,\n    )\n\n    etr = ExtraTreesRegressor(\n   \
          \     n_estimators=100,\n        max_depth=12,\n        random_state=42,\n\
          \        n_jobs=-1,\n    )\n\n    print(\"=\" * 60)\n    print(\"Training\
          \ Voting Regressor (RF + XGBoost + CatBoost + GBR + ExtraTrees)\")\n   \
          \ print(\"=\" * 60)\n\n    voting_regressor = VotingRegressor(\n       \
          \ estimators=[\n            (\"random_forest\", rf),\n            (\"xgboost\"\
          , xgb),\n            (\"catboost\", catboost),\n            (\"gradient_boosting\"\
          , gbr),\n            (\"extra_trees\", etr),\n        ],\n    )\n\n    voting_regressor.fit(X_train,\
          \ y_train)\n\n    print(\"=\" * 60)\n    print(\"Extracting Fitted Base\
          \ Models\")\n    print(\"=\" * 60)\n\n    # VotingRegressor clones + fits\
          \ each estimator internally.\n    # estimators_ holds the fitted clones\
          \ in the same order as `estimators`.\n    fitted_names = [name for name,\
          \ _ in voting_regressor.estimators]\n    fitted_models = dict(zip(fitted_names,\
          \ voting_regressor.estimators_))\n\n    model_bundle = {\n        **fitted_models,\n\
          \        \"voting_regressor\": voting_regressor,\n    }\n\n    print(\"\
          =\" * 60)\n    print(\"Saving Model Bundle\")\n    print(\"=\" * 60)\n\n\
          \    joblib.dump(\n        model_bundle,\n        model.path,\n        compress=3,\n\
          \    )\n\n    print(f\"Model bundle saved at : {model.path}\")\n    print(f\"\
          Models in bundle : {list(model_bundle.keys())}\")\n\n    print(\"=\" * 60)\n\
          \    print(\"Training Completed\")\n    print(\"=\" * 60)\n\n"
        image: pod-placement-trainer:v12
    exec-upload-metrics:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_metrics
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_metrics(\n    metrics_csv: Input[Dataset],\n):\n    from\
          \ minio import Minio\n\n    print(\"=\" * 60)\n    print(\"Connecting to\
          \ MinIO\")\n    print(\"=\" * 60)\n\n    client = Minio(\n        \"host.minikube.internal:9000\"\
          ,\n        access_key=\"minioadmin\",\n        secret_key=\"minioadmin\"\
          ,\n        secure=False,\n    )\n\n    bucket_name = \"metrics\"\n    object_name\
          \ = \"model_metrics.csv\"\n\n    if not client.bucket_exists(bucket_name):\n\
          \        client.make_bucket(bucket_name)\n        print(f\"Created bucket:\
          \ {bucket_name}\")\n\n    print(\"=\" * 60)\n    print(\"Uploading Metrics\
          \ CSV\")\n    print(\"=\" * 60)\n\n    client.fput_object(\n        bucket_name=bucket_name,\n\
          \        object_name=object_name,\n        file_path=metrics_csv.path,\n\
          \    )\n\n    print(\"=\" * 60)\n    print(\"Upload Completed\")\n    print(\"\
          =\" * 60)\n\n    print(f\"Bucket : {bucket_name}\")\n    print(f\"Object\
          \ : {object_name}\")\n\n"
        image: pod-placement-trainer:v12
    exec-upload-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.4'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_model(\n    model: Input[Model],\n):\n    import joblib\n\
          \    import tempfile\n    import os\n    from minio import Minio\n\n   \
          \ print(\"=\" * 60)\n    print(\"Connecting to MinIO\")\n    print(\"=\"\
          \ * 60)\n\n    client = Minio(\n        \"host.minikube.internal:9000\"\
          ,\n        access_key=\"minioadmin\",\n        secret_key=\"minioadmin\"\
          ,\n        secure=False,\n    )\n\n    bucket_name = \"models\"\n\n    if\
          \ not client.bucket_exists(bucket_name):\n        client.make_bucket(bucket_name)\n\
          \        print(f\"Created bucket: {bucket_name}\")\n\n    print(\"=\" *\
          \ 60)\n    print(\"Loading model bundle\")\n    print(\"=\" * 60)\n\n  \
          \  trained_models = joblib.load(model.path)\n\n    with tempfile.TemporaryDirectory()\
          \ as tmp_dir:\n\n        print(\"=\" * 60)\n        print(\"Uploading Voting\
          \ Regressor as model.pkl\")\n        print(\"=\" * 60)\n\n        voting_regressor\
          \ = trained_models[\"voting_regressor\"]\n        main_path = os.path.join(tmp_dir,\
          \ \"model.pkl\")\n        joblib.dump(voting_regressor, main_path, compress=3)\n\
          \n        client.fput_object(\n            bucket_name=bucket_name,\n  \
          \          object_name=\"model.pkl\",\n            file_path=main_path,\n\
          \        )\n        print(\"Uploaded : model.pkl (voting_regressor)\")\n\
          \n        print(\"=\" * 60)\n        print(\"Uploading Individual Base Models\"\
          )\n        print(\"=\" * 60)\n\n        for name, mdl in trained_models.items():\n\
          \            if name == \"voting_regressor\":\n                continue\n\
          \n            object_name = f\"{name}.pkl\"\n            tmp_path = os.path.join(tmp_dir,\
          \ object_name)\n\n            joblib.dump(mdl, tmp_path, compress=3)\n\n\
          \            client.fput_object(\n                bucket_name=bucket_name,\n\
          \                object_name=object_name,\n                file_path=tmp_path,\n\
          \            )\n            print(f\"Uploaded : {object_name}\")\n\n   \
          \ print(\"=\" * 60)\n    print(\"Upload Completed\")\n    print(\"=\" *\
          \ 60)\n\n    print(f\"Bucket : {bucket_name}\")\n    print(f\"Base models\
          \ uploaded : {[n for n in trained_models if n != 'voting_regressor']}\"\
          )\n\n"
